<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great Atlantis Competition</title>
    <link href="eee.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee+Inline&family=Chango&family=Libertinus+Keyboard&family=Monoton&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%;">
        <h1 style="position: absolute; top: 0; font-size: 2.8vw;">Gallery of Prompt Prowess</h1>
    <section style="height: 100vh; background-image: url(bbb.svg); width: 100%; background-repeat: no-repeat; background-size: cover;" class="P-con">
        
<a class="P-card">
        <img src="blurry-gradient-haikei (1).svg" style="width: 100%;">
        <h2>Sample Project</h2>
        <p>By: Person</p>
</a>
    </section>
        <section style="height: 100vh; background-color: rgb(167, 230, 255); width: 100%; background-repeat: no-repeat; background-size: cover;align-self: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">
        <div style="position: relative;  min-height: 100vh; background-image:url(Cloudbb.svg); background-size:90%; background-repeat: no-repeat; width: 100%; display: flex; flex-direction: column; align-self: center; align-items: center; justify-content: center; padding-left: 1rem;">
            <div style="position: absolute; top: 30%; width: inherit; height: inherit; left: 10%; bottom: 12rem;">
                <h2 style="align-self: self-start; text-align: center; width: 40%; margin-left: 9rem; font-size: 1.5vw; margin-bottom: 0;">Want to share your project and join the great great gallery?</h2>
            <form style=" width:40%;  display: flex; flex-direction: column; align-self: self-start; border-radius: 20px; margin: 9rem; margin-top: 0; height: 40%;">
            <input id="title" type="text" placeholder="Project Title" class="inp" required>
            <input id="user" type="text" placeholder="Your Username" class="inp" required>
            <input id="link" placeholder="Put the link to your project on Atlantis here!" class="inp" type="text" required>
            <label>Wanna add a photo of your project to tempt others to click on it? Add it here!</label>
            <input type="file" id="PI">
<button type="submit" style="padding: 1rem; background-color: rgb(0, 97, 136); color: whitesmoke; font-family: rubik, Arial, Helvetica, sans-serif; font-size: 1vw;">Submit!</button>
        </form>
        </div>
        </div>
    </section>
    </div>
</body>
</html>
