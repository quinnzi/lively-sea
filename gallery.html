<a class="P-card">

        <section style="height: 100vh; background-color: rgb(167, 230, 255); width: 100%; background-repeat: no-repeat; background-size: cover;align-self: center; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh;">

            <form style=" width:40%;  display: flex; flex-direction: column; align-self: self-start; border-radius: 20px; margin: 9rem; margin-top: 0; height: 40%;" id="con">

<button type="submit" style="padding: 1rem; background-color: rgb(0, 97, 136); color: whitesmoke; font-family: rubik, Arial, Helvetica, sans-serif; font-size: 1vw;" id="subi">Submit!</button>

</body>
<script>
    document.getElementById("subi").addEventListener('click', async function submitProject(e) {
        e.preventDefault()
        const form = document.getElementById("con")
        const data = new FormData(form)
try{
       const result = await fetch("/col", {
            method: "POST", 
            body: data
        })

        if(!result.ok){
           const re = await result.text()
            alert(re)
        }
        else{
            window.location.href = "/gallery.html"
        }
    }
    catch(err){

    }}
)


</script>
